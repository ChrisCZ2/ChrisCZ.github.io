<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Timer — Trackz</title>
  <link rel="stylesheet" href="css/trackz.css">
</head>
<body class="app">
  <aside>
    <a class="brand" href="timer.html">trackz<span>.</span></a>
    <nav class="side">
      <a class="active" href="timer.html">▶ <span>Timer</span></a>
      <a href="schedule.html">▦ <span>Schedule</span></a>
      <a href="projects.html">□ <span>Projects</span></a>
      <a href="dashboard.html">▤ <span>Reports</span></a>
    </nav>
    <div class="side-bottom"><a href="#" id="logout">↪ <span>Log out</span></a></div>
  </aside>
  <main class="content">
    <div class="trackbar" id="trackbar">
      <input id="barDesc" placeholder="What are you working on?" autocomplete="off">
      <div class="project-pick">
        <button type="button" class="project-btn" id="projectBtn">+ Project</button>
        <div class="project-menu hidden" id="projectMenu"></div>
      </div>
      <time id="barClock">0:00:00</time>
      <button type="button" class="play" id="barToggle" title="Start timer">▶</button>
    </div>
    <header class="top slim">
      <div>
        <div class="eyebrow">TIMER</div>
        <h1>Today’s work</h1>
      </div>
      <button class="btn ghost" id="manual">+ Manual time</button>
    </header>
    <div id="days"></div>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="close">×</button>
      <h2>Add time</h2>
      <form id="manualForm">
        <label>What did you work on?<input name="description" required placeholder="Website redesign"></label>
        <label>Project
          <select name="projectId" id="manualProject"><option value="">No project</option></select>
        </label>
        <div class="split">
          <label>When<input name="startedAt" type="datetime-local" required></label>
          <label>Duration
            <select name="duration">
              <option value="900">15 min</option>
              <option value="1800">30 min</option>
              <option value="3600" selected>1 hour</option>
              <option value="7200">2 hours</option>
              <option value="14400">4 hours</option>
            </select>
          </label>
        </div>
        <button class="btn big">Add entry</button>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/timer.js"></script>
</body>
</html>
