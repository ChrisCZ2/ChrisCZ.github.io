<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Timer — Trackz</title>
  <link rel="stylesheet" href="css/trackz.css">
</head>
<body class="app timer-page">
  <aside>
    <a class="brand" href="timer.html">trackz<span>.</span></a>
    <p class="nav-label">Analyze</p>
    <nav class="side tight">
      <a class="active" href="timer.html">Timer</a>
      <a href="timer.html?view=calendar">Calendar</a>
      <a href="dashboard.html">Reports</a>
    </nav>
    <p class="nav-label">Manage</p>
    <nav class="side tight">
      <a href="projects.html">Projects</a>
      <a href="clients.html">Clients</a>
      <a href="tags.html">Tags</a>
    </nav>
    <div class="side-bottom">
      <div class="user-chip" id="userChip"></div>
      <a href="#" id="logout">Log out</a>
    </div>
  </aside>
  <div class="workspace">
    <div id="trackbar"></div>
    <div class="workspace-body">
      <section class="workspace-main">
        <div class="view-bar">
          <div class="view-tabs">
            <button type="button" data-view="list" class="on">List</button>
            <button type="button" data-view="calendar">Calendar</button>
            <button type="button" data-view="timesheet">Timesheet</button>
          </div>
          <div class="range-nav">
            <button type="button" class="btn ghost" id="prevRange">←</button>
            <strong id="rangeLabel">This week</strong>
            <button type="button" class="btn ghost" id="nextRange">→</button>
            <button type="button" class="btn ghost" id="todayRange">Today</button>
          </div>
        </div>
        <div id="viewRoot"></div>
      </section>
      <aside class="insights" id="insights">
        <div class="insight-head">
          <h2>Insights</h2>
          <button type="button" class="ghost-ico" id="hideInsights">✕</button>
        </div>
        <a class="stat-card" href="dashboard.html">
          <span>Today</span>
          <strong id="insToday">0:00:00</strong>
          <small id="insTodayBill">0:00:00 billable</small>
        </a>
        <a class="stat-card" href="dashboard.html">
          <span>This week</span>
          <strong id="insWeek">0:00:00</strong>
          <small id="insWeekBill">0:00:00 billable</small>
        </a>
        <h3>Favorites</h3>
        <div id="favorites" class="fav-list"></div>
        <h3>Weekly goal</h3>
        <div class="goal">
          <input id="weekGoal" type="number" min="1" max="80" value="40">
          <span>hours</span>
          <div class="bar"><span id="goalBar"></span></div>
          <small id="goalCopy">0 of 40h</small>
        </div>
      </aside>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/timer.js"></script>
</body>
</html>
