<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tags — Trackz</title>
  <link rel="stylesheet" href="css/trackz.css?v=10">
</head>
<body class="app">
  <aside>
    <a class="brand" href="index.html">trackz<span>.</span></a>
    <p class="nav-label">Analyze</p>
    <nav class="side tight">
      <a href="timer.html">Timer</a>
      <a href="timer.html?view=calendar">Calendar</a>
      <a href="dashboard.html">Reports</a>
    </nav>
    <p class="nav-label">Manage</p>
    <nav class="side tight">
      <a href="projects.html">Projects</a>
      <a href="clients.html">Clients</a>
      <a class="active" href="tags.html">Tags</a>
    </nav>
    <div class="side-bottom"><a href="#" id="logout">Log out</a></div>
  </aside>
  <main class="content">
    <div id="trackbar"></div>
    <header class="top slim"><div><div class="eyebrow">MANAGE</div><h1>Tags</h1></div></header>
    <div id="list" class="panel"></div>
  </main>
  <script src="js/app.js?v=10"></script>
  <script>
    (async () => {
      await requireUser();
      await mountTrackbar();
      async function load() {
        const entries = await api('/api/entries');
        const tags = allTags(entries);
        document.querySelector('#list').innerHTML = tags.length
          ? tags.map(t => `<div class="row"><main><b>#${esc(t)}</b><small>${entries.filter(e => (e.tags || []).includes(t)).length} entries</small></main></div>`).join('')
          : '<p class="empty-copy">Add tags from the timer bar with #meeting or the # button.</p>';
      }
      document.addEventListener('trackz:refresh', load);
      await load();
    })();
  </script>
</body>
</html>
