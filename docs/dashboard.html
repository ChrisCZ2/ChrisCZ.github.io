<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports — Trackz</title>
  <link rel="stylesheet" href="css/trackz.css?v=4">
</head>
<body class="app">
  <aside>
    <a class="brand" href="index.html">trackz<span>.</span></a>
    <p class="nav-label">Analyze</p>
    <nav class="side tight">
      <a href="timer.html">Timer</a>
      <a href="timer.html?view=calendar">Calendar</a>
      <a class="active" href="dashboard.html">Reports</a>
    </nav>
    <p class="nav-label">Manage</p>
    <nav class="side tight">
      <a href="projects.html">Projects</a>
      <a href="clients.html">Clients</a>
      <a href="tags.html">Tags</a>
    </nav>
    <div class="side-bottom"><a href="#" id="logout">Log out</a></div>
  </aside>
  <main class="content">
    <div id="trackbar"></div>
    <header class="top slim">
      <div>
        <div class="eyebrow">REPORTS</div>
        <h1 id="hello">Your week</h1>
      </div>
      <div class="user" id="user"></div>
    </header>
    <section class="stats">
      <div><span>This week</span><strong id="weekTotal">0 min</strong><small>Tracked time</small></div>
      <div><span>Today</span><strong id="todayTotal">0 min</strong><small>So far</small></div>
      <div><span>Projects</span><strong id="projectCount">0</strong><small>Active</small></div>
      <div><span>Entries</span><strong id="entryCount">0</strong><small>Logged</small></div>
    </section>
    <section class="grid">
      <div class="panel">
        <div class="panel-head"><h2>Time by project</h2><a href="projects.html">Manage →</a></div>
        <div id="projects" class="list"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Recent time</h2><a href="timer.html">Timer →</a></div>
        <div id="recent" class="list"></div>
      </div>
    </section>
  </main>
  <script src="js/app.js?v=4"></script>
  <script src="js/dashboard.js?v=4"></script>
</body>
</html>
