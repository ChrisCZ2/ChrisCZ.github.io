<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports — Trackz</title>
  <link rel="stylesheet" href="css/trackz.css">
</head>
<body class="app">
  <aside>
    <a class="brand" href="timer.html">trackz<span>.</span></a>
    <nav class="side">
      <a href="timer.html">▶ <span>Timer</span></a>
      <a href="schedule.html">▦ <span>Schedule</span></a>
      <a href="projects.html">□ <span>Projects</span></a>
      <a class="active" href="dashboard.html">▤ <span>Reports</span></a>
    </nav>
    <div class="side-bottom"><a href="#" id="logout">↪ <span>Log out</span></a></div>
  </aside>
  <main class="content">
    <div class="trackbar" id="trackbar">
      <input id="barDesc" placeholder="What are you working on?" autocomplete="off">
      <div class="project-pick">
        <button type="button" class="project-btn" id="projectBtn">+ Project</button>
        <div class="project-menu hidden" id="projectMenu"></div>
      </div>
      <time id="barClock">0:00:00</time>
      <button type="button" class="play" id="barToggle" title="Start timer">▶</button>
    </div>
    <header class="top slim">
      <div>
        <div class="eyebrow">REPORTS</div>
        <h1 id="hello">Your week</h1>
      </div>
      <div class="user" id="user"></div>
    </header>
    <section class="stats">
      <div><span>This week</span><strong id="weekTotal">0 min</strong><small>Tracked time</small></div>
      <div><span>Today</span><strong id="todayTotal">0 min</strong><small>So far</small></div>
      <div><span>Projects</span><strong id="projectCount">0</strong><small>Active</small></div>
      <div><span>Entries</span><strong id="entryCount">0</strong><small>Logged</small></div>
    </section>
    <section class="grid">
      <div class="panel">
        <div class="panel-head"><h2>Time by project</h2><a href="projects.html">Manage →</a></div>
        <div id="projects" class="list"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Recent time</h2><a href="timer.html">Timer →</a></div>
        <div id="recent" class="list"></div>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
