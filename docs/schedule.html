<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Schedule — Trackz</title>
  <link rel="stylesheet" href="css/trackz.css">
</head>
<body class="app">
  <aside>
    <a class="brand" href="timer.html">trackz<span>.</span></a>
    <nav class="side">
      <a href="timer.html">▶ <span>Timer</span></a>
      <a class="active" href="schedule.html">▦ <span>Schedule</span></a>
      <a href="projects.html">□ <span>Projects</span></a>
      <a href="dashboard.html">▤ <span>Reports</span></a>
    </nav>
    <div class="side-bottom"><a href="#" id="logout">↪ <span>Log out</span></a></div>
  </aside>
  <main class="content">
    <div class="trackbar" id="trackbar">
      <input id="barDesc" placeholder="What are you working on?" autocomplete="off">
      <div class="project-pick">
        <button type="button" class="project-btn" id="projectBtn">+ Project</button>
        <div class="project-menu hidden" id="projectMenu"></div>
      </div>
      <time id="barClock">0:00:00</time>
      <button type="button" class="play" id="barToggle" title="Start timer">▶</button>
    </div>
    <header class="top slim">
      <div>
        <div class="eyebrow">SCHEDULE</div>
        <h1 id="weekTitle">This week</h1>
      </div>
      <div class="week-nav">
        <button class="btn ghost" id="prevWeek">←</button>
        <button class="btn ghost" id="todayWeek">Today</button>
        <button class="btn ghost" id="nextWeek">→</button>
      </div>
    </header>
    <p class="hint">Click an empty hour to plan work. Tracked time shows as solid blocks; planned time is dashed.</p>
    <div class="cal" id="cal"></div>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="close">×</button>
      <h2 id="slotTitle">Plan time</h2>
      <form id="slotForm">
        <input type="hidden" name="startAt" id="slotStart">
        <label>What will you work on?<input name="description" required placeholder="Deep work"></label>
        <label>Project
          <select name="projectId" id="slotProject"><option value="">No project</option></select>
        </label>
        <label>Duration
          <select name="duration">
            <option value="1800">30 min</option>
            <option value="3600" selected>1 hour</option>
            <option value="5400">1.5 hours</option>
            <option value="7200">2 hours</option>
            <option value="14400">4 hours</option>
          </select>
        </label>
        <div class="split">
          <button class="btn ghost" name="kind" value="log" type="submit">Log time</button>
          <button class="btn" name="kind" value="plan" type="submit">Schedule</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
