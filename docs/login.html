<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in — Trackz</title>
  <link rel="stylesheet" href="css/trackz.css?v=10">
  <script>if (/\.github\.io$/i.test(location.hostname)) location.replace('index.html');</script>
</head>
<body class="auth">
  <div class="auth-card">
    <a class="brand" href="index.html">trackz<span>.</span></a>
    <h1>Welcome back</h1>
    <p>Sign in with Google, GitHub, or Proton — the same way you’d start a Toggl Track workspace.</p>
    <div class="oauth">
      <a class="oauth-btn" href="/auth/google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.4 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4A7.2 7.2 0 0 1 5 12c0-.8.1-1.6.4-2.4V6.5H1.4A12 12 0 0 0 0 12c0 1.9.5 3.8 1.4 5.5l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.1 15.2 0 12 0 7.4 0 3.4 2.6 1.4 6.5l4 3.1C6.3 6.8 8.9 4.8 12 4.8z"/></svg>
        Continue with Google
      </a>
      <a class="oauth-btn" href="/auth/github">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#24292F" d="M12 0C5.4 0 0 5.4 0 12c0 5.3 3.4 9.8 8.2 11.4.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6C20.6 21.8 24 17.3 24 12 24 5.4 18.6 0 12 0z"/></svg>
        Continue with GitHub
      </a>
      <a class="oauth-btn" href="/auth/proton">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#6d4aff"/><path fill="#fff" d="M7 6.5h6.2c2.8 0 4.6 1.7 4.6 4.2S16 15 13.2 15H10v3.5H7V6.5zm3 6h2.8c1.1 0 1.8-.7 1.8-1.8s-.7-1.8-1.8-1.8H10v3.6z"/></svg>
        Continue with Proton
      </a>
    </div>
    <div id="error" class="error" style="margin-top:18px"></div>
    <p class="switch">New here? Use any provider above — Trackz creates your workspace on the first sign-in.</p>
    <p class="switch"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
  </div>
  <script src="js/app.js?v=10"></script>
  <script src="js/auth.js?v=10"></script>
</body>
</html>
